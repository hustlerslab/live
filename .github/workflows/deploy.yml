name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'
  APP_DIR: /home/ec2-user/live
  APP_NAME: aether-frontend

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to EC2
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/ec2_deploy_key"
          chmod 600 "$HOME/.ssh/ec2_deploy_key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Deploy and restart application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i "$HOME/.ssh/ec2_deploy_key" "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/ec2-user/live
          git fetch --prune origin main
          git checkout -B main origin/main
          npm ci
          npm run build
          sudo systemctl daemon-reload
          sudo systemctl enable aether-frontend
          sudo systemctl restart aether-frontend
          sudo systemctl is-active --quiet aether-frontend
          REMOTE

      - name: Smoke test
        run: |
          # Hit the real vhost, not the bare IP: an IP request matches no
          # server_name and falls through to nginx's default page, which
          # returns 200 even when the app is down.
          for host in theallureinteriors.com www.theallureinteriors.com; do
            code=$(curl -sS -m 30 -o /tmp/body -w '%{http_code}' "https://$host/")
            echo "$host -> HTTP $code"
            test "$code" -lt 400
            grep -q "ALLURE" /tmp/body || { echo "app content missing on $host"; exit 1; }
          done
