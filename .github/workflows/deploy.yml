name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'
  # The domain, not an IP: DNS already tracks the server, so an EC2 restart
  # (which hands out a new public IP) no longer breaks the pipeline.
  DEPLOY_HOST: theallureinteriors.com
  DEPLOY_USER: ec2-user
  APP_DIR: /home/ec2-user/live
  SERVICE: aether-frontend

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    name: Deploy to EC2
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Preflight - required secret present
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_SSH_KEY" ]; then
            echo "::error::Secret EC2_SSH_KEY is empty or not set."
            echo "Add it at Settings > Secrets and variables > Actions."
            echo "Value = the private key from the server: ~ec2-user/.ssh/gh_deploy"
            exit 1
          fi
          echo "EC2_SSH_KEY present (${#EC2_SSH_KEY} chars)"

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          # Keyscan instead of a pinned EC2_KNOWN_HOSTS secret, which goes
          # stale every time the instance restarts on a new IP.
          ssh-keyscan -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" 'echo SSH OK on $(hostname)'

      - name: Deploy and restart
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<REMOTE
          set -euo pipefail
          cd "$APP_DIR"
          git fetch --prune origin main
          git checkout -B main origin/main
          echo "deploying \$(git rev-parse --short HEAD)"
          npm ci
          npm run build
          sudo systemctl restart "$SERVICE"
          sleep 5
          sudo systemctl is-active --quiet "$SERVICE"
          REMOTE

      - name: Smoke test
        run: |
          # Request the real vhost: a bare-IP request matches no server_name
          # and falls through to nginx's default page, returning 200 even
          # when the app is down.
          for host in theallureinteriors.com www.theallureinteriors.com; do
            code=$(curl -sS -m 30 -o /tmp/body -w '%{http_code}' "https://$host/")
            echo "$host -> HTTP $code"
            test "$code" -lt 400
            grep -q "ALLURE" /tmp/body || { echo "::error::app content missing on $host"; exit 1; }
          done
